
# Warning: messing with this file will give you an automatic 0 on your assignment.
name: Lean Action CI

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  build:
    if: |
      github.actor != 'github-classroom[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "run-limiter"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: check
        run: |
          if [ 1 -lt ${{ github.run_attempt }} ]; then
            echo "Re-running the action does not work to re-submit your homework.  Push a new commit instead.  Aborting run."
            gh run cancel ${{ github.run_id }}
            echo "should-run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          MIN_HOURS=6
          runs=$(gh run list --limit=100 --json databaseId,createdAt)
          threshold_timestamp=$(date -d "$MIN_HOURS hours ago" +%s)
          recent_runs=$(echo $runs | \
            jq --argjson threshold $threshold_timestamp --argjson current_run ${{ github.run_id }} \
            '[.[] | .createdAtTimestamp = (.createdAt | fromdateiso8601) | select(.createdAtTimestamp > $threshold and .databaseId != $current_run) | .databaseId]')
          
          last_run_timestamp=$(date -d "$last_run" +%s)
          if [ "$recent_runs" = "[]" ]; then
            echo "No runs found, running."
            echo "should-run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$(echo "$recent_runs" | jq 'length')" -ge 2 ]; then
            echo "Grader spam detected.  Timeout duration reset."
            echo "Please wait $MIN_HOURS hours before submitting again."
            exit 1
          fi

          # Check if any recent run had build job complete (not skipped)
          has_recent_build=$(echo "$recent_runs" | jq -r '.[]' | while read run_id; do
            gh run view "$run_id" --json jobs --jq '.jobs[] | select(.name == "build" and .conclusion != "skipped" and .conclusion != "cancelled" and .conclusion != null)'
          done)

          if [ -n "$has_recent_build" ]; then
            echo "Last run too recent:" $has_recent_build
            gh run cancel ${{ github.run_id }}
            echo "should-run=false" >> $GITHUB_OUTPUT
          else
            echo "Last run at least $MIN_HOURS ago, running."
            echo "should-run=true" >> $GITHUB_OUTPUT
          fi
      - name: "report-issue"
        if: steps.check.outputs.should-run == 'false'
        run:
          echo "Submission failed, read the output of the previous step to find out why."
          echo "Most likely, you are trying to submit too frequently."
      - uses: leanprover/lean-action@v1
        if: steps.check.outputs.should-run == 'true'
      - name: "test-output"
        if: steps.check.outputs.should-run == 'true'
        run: lake build > ./lake_output

      - name: ex01
        id: ex01
        uses: classroom-resources/autograding-command-grader@v1
        if: steps.check.outputs.should-run == 'true'
        with:
          test-name: ex01
          setup-command: ''
          command: (! grep ex01 | grep -q unsolved) < ./lake_output
          timeout: 1
          max-score: 1

      - name: ex02
        id: ex02
        uses: classroom-resources/autograding-command-grader@v1
        if: steps.check.outputs.should-run == 'true'
        with:
          test-name: ex02
          setup-command: ''
          command: (! grep ex02 | grep -q unsolved) < ./lake_output
          timeout: 1
          max-score: 1

      - name: ex03
        id: ex03
        uses: classroom-resources/autograding-command-grader@v1
        if: steps.check.outputs.should-run == 'true'
        with:
          test-name: ex03
          setup-command: ''
          command: (! grep ex03 | grep -q unsolved) < ./lake_output
          timeout: 1
          max-score: 1

      - name: ex04
        id: ex04
        uses: classroom-resources/autograding-command-grader@v1
        if: steps.check.outputs.should-run == 'true'
        with:
          test-name: ex04
          setup-command: ''
          command: (! grep ex04 | grep -q unsolved) < ./lake_output
          timeout: 1
          max-score: 1

      - name: ex05
        id: ex05
        uses: classroom-resources/autograding-command-grader@v1
        if: steps.check.outputs.should-run == 'true'
        with:
          test-name: ex05
          setup-command: ''
          command: (! grep ex05 | grep -q unsolved) < ./lake_output
          timeout: 1
          max-score: 2

      - name: ex06
        id: ex06
        uses: classroom-resources/autograding-command-grader@v1
        if: steps.check.outputs.should-run == 'true'
        with:
          test-name: ex06
          setup-command: ''
          command: (! grep ex06 | grep -q unsolved) < ./lake_output
          timeout: 1
          max-score: 2

      - name: ex07
        id: ex07
        uses: classroom-resources/autograding-command-grader@v1
        if: steps.check.outputs.should-run == 'true'
        with:
          test-name: ex07
          setup-command: ''
          command: (! grep ex07 | grep -q unsolved) < ./lake_output
          timeout: 1
          max-score: 2

      - name: ex08
        id: ex08
        uses: classroom-resources/autograding-command-grader@v1
        if: steps.check.outputs.should-run == 'true'
        with:
          test-name: ex08
          setup-command: ''
          command: (! grep ex08 | grep -q unsolved) < ./lake_output
          timeout: 1
          max-score: 2

      - name: Autograding Reporter
        if: steps.check.outputs.should-run == 'true'
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          EX01_RESULTS: "${{steps.ex01.outputs.result}}"
          EX02_RESULTS: "${{steps.ex02.outputs.result}}"
          EX03_RESULTS: "${{steps.ex03.outputs.result}}"
          EX04_RESULTS: "${{steps.ex04.outputs.result}}"
          EX05_RESULTS: "${{steps.ex05.outputs.result}}"
          EX06_RESULTS: "${{steps.ex06.outputs.result}}"
          EX07_RESULTS: "${{steps.ex07.outputs.result}}"
          EX08_RESULTS: "${{steps.ex08.outputs.result}}"
        with:
          runners: ex01, ex02, ex03, ex04, ex05, ex06, ex07, ex08
